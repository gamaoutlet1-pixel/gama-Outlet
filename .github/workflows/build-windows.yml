name: Build Gama Outlet Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Create version tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not (git ls-remote --tags origin "refs/tags/$tag")) {
            git tag $tag
            git push origin $tag
          }

      - name: Package installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "dist/Gama-Outlet-Setup-$version.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "Arquivos em dist:"
            Get-ChildItem dist | Select-Object Name, Length
            throw "Instalador não encontrado: $exe"
          }
          if (-not (Test-Path "dist/latest.yml")) {
            throw "latest.yml não encontrado. O auto-updater não poderá localizar atualizações."
          }
          Write-Host "Instalador encontrado: $exe"
          Write-Host "latest.yml encontrado."

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $exe = "dist/Gama-Outlet-Setup-$version.exe"
          $blockmap = "dist/Gama-Outlet-Setup-$version.exe.blockmap"
          $latest = "dist/latest.yml"

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Gama Outlet $version" --generate-notes --latest
          }

          gh release upload $tag $exe $blockmap $latest --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gama-outlet-windows
          path: |
            dist/Gama-Outlet-Setup-*.exe
            dist/Gama-Outlet-Setup-*.exe.blockmap
            dist/latest.yml
