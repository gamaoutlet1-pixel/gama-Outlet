name: Import Lovable Project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Stop when already imported
        id: guard
        shell: bash
        run: |
          if [ -f .gama-lovable-imported ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Lovable source
        if: steps.guard.outputs.already == 'false'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/gamaoutlet1-pixel/atual-v5-gest-o-controle-estoque-lotes.git "$tmp/source"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.github/' \
            --exclude='.gama-lovable-imported' \
            "$tmp/source/" ./
          printf '%s\n' 'Lovable source imported from gamaoutlet1-pixel/atual-v5-gest-o-controle-estoque-lotes' > .gama-lovable-imported

      - name: Add Electron desktop layer
        if: steps.guard.outputs.already == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p electron
          cat > electron/main.cjs <<'EOF'
          const { app, BrowserWindow } = require('electron');
          const { spawn } = require('child_process');
          const path = require('path');
          const waitOn = require('wait-on');
          const { autoUpdater } = require('electron-updater');

          let serverProcess;
          const PORT = 4173;
          const URL = `http://127.0.0.1:${PORT}`;

          function startServer() {
            const entry = path.join(process.resourcesPath, '.output', 'server', 'index.mjs');
            serverProcess = spawn(process.execPath, [entry], {
              env: {
                ...process.env,
                ELECTRON_RUN_AS_NODE: '1',
                PORT: String(PORT),
                HOST: '127.0.0.1',
                NITRO_PORT: String(PORT),
                NITRO_HOST: '127.0.0.1',
              },
              stdio: 'inherit',
              windowsHide: true,
            });
            serverProcess.on('exit', (code) => {
              if (code && !app.isQuitting) console.error(`[Gama Outlet] servidor terminou: ${code}`);
            });
          }

          async function createWindow() {
            startServer();
            await waitOn({ resources: [URL], timeout: 30000 });
            const win = new BrowserWindow({
              width: 1440,
              height: 900,
              minWidth: 1100,
              minHeight: 700,
              backgroundColor: '#0b1118',
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true,
              },
            });
            await win.loadURL(URL);
          }

          function setupUpdater() {
            if (!app.isPackaged) return;
            autoUpdater.autoDownload = true;
            autoUpdater.autoInstallOnAppQuit = true;
            autoUpdater.checkForUpdates().catch(() => {});
            autoUpdater.on('update-downloaded', () => {
              setTimeout(() => autoUpdater.quitAndInstall(false, true), 1000);
            });
          }

          app.isQuitting = false;
          app.whenReady().then(async () => {
            try {
              await createWindow();
              setupUpdater();
            } catch (error) {
              console.error(error);
              app.quit();
            }
          });

          app.on('before-quit', () => {
            app.isQuitting = true;
            if (serverProcess && !serverProcess.killed) serverProcess.kill();
          });
          app.on('window-all-closed', () => app.quit());
          EOF

          cat > electron/preload.cjs <<'EOF'
          const { contextBridge } = require('electron');
          contextBridge.exposeInMainWorld('gamaDesktop', {
            platform: process.platform,
            version: require('../package.json').version,
          });
          EOF

          node <<'EOF'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = 'gama-outlet';
          p.version = '0.2.0';
          p.description = 'Gama Outlet ERP';
          p.main = 'electron/main.cjs';
          p.scripts = {
            ...p.scripts,
            'desktop:dev': 'npm run build && electron electron/main.cjs',
            'build:desktop': 'npm run build && electron-builder --win nsis --x64 --publish never',
            'release:win': 'npm run build && electron-builder --win nsis --x64 --publish always',
          };
          p.devDependencies = {
            ...p.devDependencies,
            electron: '^37.0.0',
            'electron-builder': '^26.0.0',
          };
          p.dependencies = {
            ...p.dependencies,
            'electron-updater': '^6.6.2',
            'wait-on': '^8.0.3',
          };
          p.build = {
            appId: 'br.com.gamaoutlet.gamaoutlet',
            productName: 'Gama Outlet',
            directories: { output: 'dist' },
            files: ['.output/**/*', 'electron/**/*', 'package.json'],
            win: {
              target: [{ target: 'nsis', arch: ['x64'] }],
              artifactName: 'Gama-Outlet-Setup-${version}.${ext}',
            },
            nsis: {
              oneClick: false,
              perMachine: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true,
              shortcutName: 'Gama Outlet',
            },
            publish: [{
              provider: 'github',
              owner: 'gamaoutlet1-pixel',
              repo: 'gama-Outlet',
              releaseType: 'release',
            }],
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          EOF

      - name: Commit migration
        if: steps.guard.outputs.already == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Lovable application into Gama Outlet desktop' || exit 0
          git push origin main
