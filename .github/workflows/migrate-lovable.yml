name: Import Lovable Base

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate:
    if: ${{ !hashFiles('.gama-lovable-imported') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Gama Outlet
        uses: actions/checkout@v4

      - name: Copy Lovable project
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/gamaoutlet1-pixel/atual-v5-gest-o-controle-estoque-lotes.git "$tmp/source"

          # Preserve our Git metadata and migration/build workflow files, while importing
          # the complete Lovable application source into this repository.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.github/workflows/migrate-lovable.yml' \
            --exclude='.github/workflows/build-windows.yml' \
            "$tmp/source/" ./

          printf '%s\n' 'Imported from gamaoutlet1-pixel/atual-v5-gest-o-controle-estoque-lotes' > .gama-lovable-imported

      - name: Add Electron packaging layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p electron
          cat > electron/main.cjs <<'EOF'
          const { app, BrowserWindow } = require('electron');
          const { spawn } = require('child_process');
          const path = require('path');
          const waitOn = require('wait-on');
          const { autoUpdater } = require('electron-updater');

          let serverProcess;
          const PORT = 4173;
          const HOST = `127.0.0.1:${PORT}`;

          function startServer() {
            const entry = path.join(process.resourcesPath, '.output', 'server', 'index.mjs');
            serverProcess = spawn(process.execPath, [entry], {
              env: {
                ...process.env,
                PORT: String(PORT),
                HOST: '127.0.0.1',
                NITRO_PORT: String(PORT),
                NITRO_HOST: '127.0.0.1',
              },
              stdio: 'inherit',
              windowsHide: true,
            });
          }

          async function createWindow() {
            startServer();
            await waitOn({ resources: [`http://${HOST}`], timeout: 30000 });

            const win = new BrowserWindow({
              width: 1440,
              height: 900,
              minWidth: 1100,
              minHeight: 700,
              backgroundColor: '#0b1118',
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true,
              },
            });

            await win.loadURL(`http://${HOST}`);
          }

          function setupAutoUpdater() {
            if (!app.isPackaged) return;
            autoUpdater.autoDownload = true;
            autoUpdater.autoInstallOnAppQuit = true;
            autoUpdater.checkForUpdates().catch(() => {});
            autoUpdater.on('update-downloaded', () => {
              setTimeout(() => autoUpdater.quitAndInstall(false, true), 1000);
            });
          }

          app.whenReady().then(async () => {
            try {
              await createWindow();
              setupAutoUpdater();
            } catch (error) {
              console.error(error);
              app.quit();
            }
          });

          app.on('before-quit', () => {
            if (serverProcess && !serverProcess.killed) serverProcess.kill();
          });

          app.on('window-all-closed', () => app.quit());
          EOF

          cat > electron/preload.cjs <<'EOF'
          const { contextBridge } = require('electron');
          contextBridge.exposeInMainWorld('gamaDesktop', {
            platform: process.platform,
            version: require('../package.json').version,
          });
          EOF

          node <<'EOF'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = 'gama-outlet';
          p.version = '0.2.0';
          p.description = 'Gama Outlet ERP';
          p.main = 'electron/main.cjs';
          p.scripts = {
            ...p.scripts,
            'desktop:dev': 'npm run build && electron electron/main.cjs',
            'build:desktop': 'npm run build && electron-builder --win nsis --x64 --publish never',
            'release:win': 'npm run build && electron-builder --win nsis --x64 --publish always',
          };
          p.devDependencies = {
            ...p.devDependencies,
            electron: '^37.0.0',
            'electron-builder': '^26.0.0',
          };
          p.dependencies = {
            ...p.dependencies,
            'electron-updater': '^6.6.2',
            'wait-on': '^8.0.3',
          };
          p.build = {
            appId: 'br.com.gamaoutlet.gamaoutlet',
            productName: 'Gama Outlet',
            directories: { output: 'dist' },
            files: [
              '.output/**/*',
              'electron/**/*',
              'package.json',
            ],
            win: {
              target: [{ target: 'nsis', arch: ['x64'] }],
              artifactName: 'Gama-Outlet-Setup-${version}.${ext}',
            },
            nsis: {
              oneClick: false,
              perMachine: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true,
              shortcutName: 'Gama Outlet',
            },
            publish: [{
              provider: 'github',
              owner: 'gamaoutlet1-pixel',
              repo: 'gama-Outlet',
              releaseType: 'release',
            }],
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          EOF

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Lovable application into desktop project'
          git push origin main
